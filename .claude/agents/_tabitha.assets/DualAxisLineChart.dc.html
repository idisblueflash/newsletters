<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>双轴折线图组件</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</helmet>

<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{accent}};">组件 · 双轴折线图</span>
    <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: #171717;">{{title}}</h2>
    <p style="margin: 0; font-size: 16px; color: #6B7280; max-width: 680px; line-height: 1.7;">{{description}}</p>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: #EDF2F4; border-radius: 8px;">
    <span style="display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{accent}}; color: #ffffff; flex-shrink: 0;">{{highlight.badge}}</span>
    <span style="font-size: 14px; color: #262626; line-height: 1.6;">{{highlight.text}}</span>
  </div>

  <div style="display: flex; align-items: center; gap: 28px;">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{accent}};">
      <svg width="20" height="10" viewBox="0 0 20 10"><line x1="0" y1="5" x2="20" y2="5" stroke="{{accent}}" stroke-width="3"></line></svg>
      {{leftSeries.name}}
    </span>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #8A5A33;">
      <svg width="20" height="10" viewBox="0 0 20 10"><line x1="0" y1="5" x2="20" y2="5" stroke="#8A5A33" stroke-width="3" stroke-dasharray="6,5"></line></svg>
      {{rightSeries.name}}
    </span>
  </div>

  <svg width="1032" height="380" viewBox="0 0 1032 380" style="overflow: visible;">
    <sc-for list="{{leftTicks}}" as="t" hint-placeholder-count="5">
      <line x1="{{chart.left}}" y1="{{t.y}}" x2="{{chart.right}}" y2="{{t.y}}" stroke="#E5E7EB" stroke-width="1"></line>
      <text x="{{chart.leftLabelX}}" y="{{t.textY}}" text-anchor="end" font-size="12" fill="{{accent}}">{{t.label}}</text>
    </sc-for>
    <sc-for list="{{rightTicks}}" as="t" hint-placeholder-count="6">
      <text x="{{chart.rightLabelX}}" y="{{t.textY}}" text-anchor="start" font-size="12" fill="#8A5A33">{{t.label}}</text>
    </sc-for>

    <line x1="{{marker.x}}" y1="{{chart.top}}" x2="{{marker.x}}" y2="{{chart.bottom}}" stroke="#171717" stroke-width="1.5" stroke-dasharray="4,4"></line>
    <text x="{{marker.labelX}}" y="{{chart.top}}" text-anchor="middle" font-size="12" font-weight="700" fill="#171717" transform="translate(0,-8)">{{marker.label}}</text>

    <line x1="{{chart.left}}" y1="{{chart.top}}" x2="{{chart.left}}" y2="{{chart.bottom}}" stroke="#171717" stroke-width="1.5"></line>
    <line x1="{{chart.left}}" y1="{{chart.bottom}}" x2="{{chart.right}}" y2="{{chart.bottom}}" stroke="#171717" stroke-width="2"></line>

    <sc-for list="{{xTicks}}" as="xt" hint-placeholder-count="4">
      <text x="{{xt.x}}" y="{{chart.xLabelY}}" text-anchor="middle" font-size="13" font-weight="600" fill="#171717">{{xt.label}}</text>
    </sc-for>

    <polyline points="{{leftSeries.points}}" fill="none" stroke="{{accent}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <sc-for list="{{leftSeries.dots}}" as="d" hint-placeholder-count="4">
      <circle cx="{{d.cx}}" cy="{{d.cy}}" r="4.5" fill="#ffffff" stroke="{{accent}}" stroke-width="2.5"></circle>
    </sc-for>

    <polyline points="{{rightSeries.points}}" fill="none" stroke="#8A5A33" stroke-width="3" stroke-dasharray="6,5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <sc-for list="{{rightSeries.dots}}" as="d" hint-placeholder-count="4">
      <circle cx="{{d.cx}}" cy="{{d.cy}}" r="4.5" fill="#8A5A33"></circle>
    </sc-for>
  </svg>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#2B4C5C", "options": ["#2B4C5C", "#171717", "#8A5A33"]},
  "$preview": {"width": 1160, "height": 780}
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B4C5C';

    // Plot geometry lives inside the 1032px content box (1160 container minus 64px padding
    // on each side) — NOT the full 1160px container width.
    const CONTENT_W = 1032;
    const left = 56, right = CONTENT_W - 56, top = 24, bottom = 324;
    const plotW = right - left, plotH = bottom - top;

    const xLabels = ['512', '768', '1024', '1280'];
    const xTicks = xLabels.map((label, i) => ({
      label,
      x: +(left + i * (plotW / (xLabels.length - 1))).toFixed(1)
    }));

    // Left axis: average cost efficiency (seconds per megapixel) across the compared models —
    // lower is better. Right axis: average quality score (1-10) across the same models.
    const leftName = '平均秒/百万像素（左轴，越低越省）';
    const leftValues = [196.2, 137.4, 127.2, 129.0];
    const rightName = '平均质量分（右轴，1-10）';
    const rightValues = [7.33, 8.33, 8.0, 7.0];

    const leftMax = Math.ceil((Math.max(...leftValues) * 1.1) / 20) * 20;
    const rightMax = 10;
    const yLeft = v => +(top + plotH - (v / leftMax) * plotH).toFixed(1);
    const yRight = v => +(top + plotH - (v / rightMax) * plotH).toFixed(1);

    const buildSeries = (name, values, yFn) => {
      const dots = values.map((v, i) => ({ cx: xTicks[i].x, cy: yFn(v) }));
      return { name, points: dots.map(d => `${d.cx},${d.cy}`).join(' '), dots };
    };

    const leftSeries = buildSeries(leftName, leftValues, yLeft);
    const rightSeries = buildSeries(rightName, rightValues, yRight);

    const leftTicks = [];
    for (let i = 0; i <= 4; i++) {
      const v = (leftMax / 4) * i;
      leftTicks.push({ y: yLeft(v), textY: yLeft(v) + 4, label: `${Math.round(v)}` });
    }
    const rightTicks = [];
    for (let i = 0; i <= 5; i++) {
      const v = (rightMax / 5) * i;
      rightTicks.push({ y: yRight(v), textY: yRight(v) + 4, label: `${v.toFixed(0)}` });
    }

    // Marker line at whichever x-tick is the "sweet spot" being called out — index 1 (768) here.
    const markerIdx = 1;

    return {
      accent,
      title: '耗时省下来的钱，买不回掉下去的画质',
      description: '左轴：三模型平均「秒/百万像素」（越低越划算）；右轴：三模型平均质量分（1-10）。两条线在拐点之后走向不同方向。',
      chart: { left, right, top, bottom, leftLabelX: left - 10, rightLabelX: right + 10, xLabelY: bottom + 24 },
      xTicks,
      leftTicks,
      rightTicks,
      leftSeries,
      rightSeries,
      marker: { x: xTicks[markerIdx].x, labelX: xTicks[markerIdx].x, label: `${xLabels[markerIdx]} 甜蜜点` },
      highlight: {
        badge: '甜蜜点 768',
        text: '768 之后，画质均分从 8.33 掉到 7.0；但耗时效率几乎原地踏步（127 → 129 秒/百万像素）——多花的钱买不到更好的画质。'
      }
    };
  }
}
</script>
</body>
</html>
