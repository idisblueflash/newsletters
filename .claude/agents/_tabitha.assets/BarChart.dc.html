<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>条形图组件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</helmet>

<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{accent}};">组件 · 条形图</span>
    <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: #171717;">同一指标，多个情形</h2>
    <p style="margin: 0; font-size: 16px; color: #6B7280; max-width: 640px; line-height: 1.7;">同一个数值指标在三到六个情形之间对比时使用，每个情形一根条形，要强调的情形用强调色，其余用中性灰。</p>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: #EDF2F4; border-radius: 8px;">
    <span style="display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{accent}}; color: #ffffff; flex-shrink: 0;">{{highlight.badge}}</span>
    <span style="font-size: 14px; color: #262626; line-height: 1.6;">{{highlight.text}}</span>
  </div>

  <div style="display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 24px; padding: 0 0 14px 0; border-bottom: 2px solid #171717;">
      <span style="width: 200px; flex-shrink: 0; font-size: 14px; font-weight: 700; color: #171717;">{{labelHeading}}</span>
      <span style="flex: 1; font-size: 14px; font-weight: 700; color: #171717;">{{valueHeading}}</span>
    </div>

    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 24px; padding: 18px 0; border-bottom: 1px solid #E5E7EB;">
        <div style="width: 200px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 15px; font-weight: 700; color: #171717;">{{r.label}}</span>
          <span style="font-size: 13px; color: #6B7280;">{{r.sub}}</span>
        </div>
        <div style="flex: 1; display: flex; align-items: center; gap: 16px;">
          <div style="flex: 1; height: 14px; background: #F3F3F1; border-radius: 999px; overflow: hidden;">
            <div style="width: {{r.pct}}%; height: 100%; background: {{r.barColor}}; border-radius: 999px;"></div>
          </div>
          <span style="width: 150px; text-align: right; font-size: 14px; font-weight: {{r.valueWeight}}; color: {{r.valueColor}}; flex-shrink: 0;">{{r.display}}</span>
        </div>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#2B4C5C", "options": ["#2B4C5C", "#171717", "#8A5A33"]},
  "$preview": {"width": 1160, "height": 640}
}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2B4C5C';

    // value: the number the bar length maps to (here: years to reach 1000 hours)
    const data = [
      { label: '1 goal', sub: '3 hours a day', value: 0.92, display: 'about 11 months', emphasis: true },
      { label: '3 goals', sub: '1 hour a day each', value: 2.7, display: 'about 2.7 years', emphasis: false },
      { label: '5 goals', sub: '0.6 hours a day each', value: 4.6, display: 'about 4.6 years', emphasis: true }
    ];

    const max = Math.max(...data.map((d) => d.value));
    const rows = data.map((d) => ({
      ...d,
      pct: Math.max(6, Math.round((d.value / max) * 100)),
      barColor: d.emphasis ? accent : '#9CA3AF',
      valueColor: d.emphasis ? accent : '#6B7280',
      valueWeight: d.emphasis ? 700 : 500
    }));

    return {
      accent,
      labelHeading: 'With 3 free hours a day',
      valueHeading: 'Time to reach 1000 hours, per goal',
      highlight: { badge: '5× longer', text: 'Same person, same three hours: one goal reaches 1000 hours in under a year, five goals each take about 4.6 years.' },
      rows
    };
  }
}
</script>
</body>
</html>
