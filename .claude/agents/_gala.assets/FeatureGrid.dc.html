<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>主次图网格组件</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</helmet>

<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{accent}};">组件 · 主次图网格</span>
    <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: #171717;">主次图网格</h2>
    <p style="margin: 0; font-size: 16px; color: #6B7280; max-width: 640px; line-height: 1.7;">图片网格的变体：一张主图配四张细节图时使用。左边一张大图，右边 2×2 四张小图，两边等宽、上下对齐，图注延续正文的说明文字样式。和图片网格一样，渲染出的图里只有网格本身，不带标题、不带说明段落。</p>
    <p style="margin: 0; font-size: 13px; color: #9CA3AF; max-width: 640px; line-height: 1.6;">固定 5 张：第 1 张是主图，第 2–5 张按行填进右侧 2×2。小图按 4:3 裁切（object-fit: cover）；主图高度跟右侧两行对齐，按需裁切，所以主体放在画面中部。渲染时容器 padding 用 40px。</p>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px;">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="flex-grow: 1; width: 100%; background: #F3F3F1; border: 1px dashed #D4D4D4; border-radius: 4px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
        <span style="font-size: 13px; color: #9CA3AF; text-align: center; padding: 0 12px;">主图占位</span>
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">{{hero.caption}}</figcaption>
    </figure>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
      <sc-for list="{{details}}" as="img" hint-placeholder-count="4">
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
          <div style="width: 100%; aspect-ratio: 4/3; background: #F3F3F1; border: 1px dashed #D4D4D4; border-radius: 4px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
            <span style="font-size: 13px; color: #9CA3AF; text-align: center; padding: 0 12px;">细节图占位 {{img.index}}</span>
          </div>
          <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">{{img.caption}}</figcaption>
        </figure>
      </sc-for>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#2B4C5C", "options": ["#2B4C5C", "#171717", "#8A5A33"]},
  "$preview": {"width": 1160, "height": 860}
}'>
class Component extends DCLogic {
  renderVals() {
    const captions = [
      '图二 · 椰壳的缝隙',
      '图三 · 缝里露出的一只眼',
      '图四 · 收紧的触手',
      '图五 · 合上的两半壳'
    ];
    const details = captions.map((caption, i) => ({ caption, index: i + 2 }));
    return {
      accent: this.props.accent ?? '#2B4C5C',
      hero: { caption: '图一 · 躲进椰壳的章鱼' },
      details
    };
  }
}
</script>
</body>
</html>
