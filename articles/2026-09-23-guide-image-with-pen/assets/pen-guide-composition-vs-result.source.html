<body style="display:inline-block">
<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">

  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-23-guide-image-with-pen/ComfyUI_temp_tqyfj_00001_.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">手绘构图（Canny 轮廓）</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-23-guide-image-with-pen/zimage-turbo-gguf_00048_.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">AI 生成结果</figcaption>
    </figure>
  </div>

</div>
</body>
</html>
