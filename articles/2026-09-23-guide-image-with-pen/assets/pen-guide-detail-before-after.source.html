<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</head>
<body style="display:inline-block">
<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: #171717;">细节修复前后对比</h2>
    <p style="margin: 0; font-size: 16px; color: #6B7280; max-width: 640px; line-height: 1.7;">用照片风格转轮廓图再重新生成一次之后，燕子尾巴的三条线问题被修好了。四处三条线的问题，修好了三处。</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-23-guide-image-with-pen/close-look-on-tails.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">改进前：橙色圆圈标出燕子尾巴出现三条线的问题</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-23-guide-image-with-pen/refined-detail-circle.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">改进后：绿色圆圈标出同样位置，尾巴细节已修好</figcaption>
    </figure>
  </div>

</div>
</body>
</html>
