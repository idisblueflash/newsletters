<head><meta charset="utf-8"><title>one-shot flaws feature grid</title></head>

      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">

          <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-10-01-ink-style-photorealistic/images/raw/one-shot-flaw-head.png" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">

          <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-10-01-ink-style-photorealistic/images/raw/one-shot-flaw-dark.png" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">
        </div>
        <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">图三 · 暗部是灰的，没有大块纯黑</figcaption>
      </figure>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
        <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
