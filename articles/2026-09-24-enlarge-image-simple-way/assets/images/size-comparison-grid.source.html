<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>size comparison grid - closeup</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;display:inline-block;}
</style>
</head>
<body>

<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 40px; display: flex; flex-direction: column;">

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-24-enlarge-image-simple-way/assets/images/closeup-original.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">原图局部（768×768 裁切）</figcaption>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-24-enlarge-image-simple-way/assets/images/closeup-upscaled.png" style="width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">放大后局部（1536×1536 裁切）</figcaption>
    </figure>

  </div>

</div>
</body>
</html>
