<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</head>
<body>
<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 64px; display: flex; flex-direction: column; gap: 28px;">

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: #171717;">放大 + 剪裁后，构图被破坏</h2>
    <p style="margin: 0; font-size: 16px; color: #6B7280; max-width: 640px; line-height: 1.7;">原本的构图在正方形里很好地体现了：两条电线上落着燕子。但是放大再截取后，就剩下了一条电线。</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; background: #F3F3F1; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-26-enlarge-image-without-painting/composition-result-raw.jpeg" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">方形燕子图</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; background: #F3F3F1; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-26-enlarge-image-without-painting/cropped.jpeg" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">剪裁后的燕子图</figcaption>
    </figure>
  </div>

</div>
</body>
</html>
