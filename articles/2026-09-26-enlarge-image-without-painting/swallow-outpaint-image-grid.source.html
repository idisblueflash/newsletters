<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  body{margin:0;display:inline-block;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#ffffff;color:#171717;}
</style>
</head>
<body>
<div style="width: 1160px; box-sizing: border-box; background: #ffffff; padding: 40px; display: flex; flex-direction: column; gap: 28px;">
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-26-enlarge-image-without-painting/outpaint-swift/pixaroma_outpaint_base_4290c4fda2be.png" style="width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">正方形燕子图</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-26-enlarge-image-without-painting/both-mask.png" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">向两边扩展，灰色是要补的区域</figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="width: 100%; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;">
        <img src="file:///Users/husongtao/Projects/newsletters/articles/2026-09-26-enlarge-image-without-painting/both-out.png" style="width: 100%; height: 100%; object-fit: contain; object-position: center; display: block;">
      </div>
      <figcaption style="font-size: 14px; color: #6B7280; line-height: 1.6;">拓宽后的燕子图</figcaption>
    </figure>
  </div>
</div>
</body>
</html>
